[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-langgraph-agent"
version = "0.1.0"
description = "A multi-server MCP client orchestrated with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "setuptools>=84.1",
  "mcp>=1.29.0,<2.0",
  "langgraph>=0.6.0",
  "langchain-core>=0.3.0",
]

[project.optional-dependencies]
model = ["langchain-openai>=0.3.0", "pydantic>=2.0"]
dev = ["build>=1.2.0", "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0", "ruff>=0.8.0", "pip-audit>=2.7.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
